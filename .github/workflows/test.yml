name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  refs:
    name: Check action refs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # actionlint does not check that the actions used by the shared actions exist
      - name: Resolve every action ref
        run: |
          failed=0
          while read -r ref; do
            repo="${ref%%@*}"
            version="${ref#*@}"
            repo="$(cut -d/ -f1-2 <<< "$repo")"
            if [[ "$version" =~ ^[0-9a-f]{40}$ ]] \
              || git ls-remote --exit-code "https://github.com/$repo" "refs/tags/$version" "refs/heads/$version" > /dev/null; then
              echo "ok   $ref"
            else
              echo "::error::Unable to resolve $ref"
              failed=1
            fi
          done < <(grep -hoE 'uses: *[^ ./][^ ]*@[^ ]+' ./*/action.yml | sed 's/uses: *//' | sort -u)
          exit "$failed"

  discover:
    name: Discover actions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      actions: ${{ steps.find.outputs.actions }}
    steps:
      - uses: actions/checkout@v7

      - name: Find actions with tests
        id: find
        run: |
          actions=$(find . -mindepth 1 -maxdepth 1 -type d ! -name '.*' -exec test -f '{}/test/entrypoint.sh' ';' -print \
            | sed 's|^\./||' | sort | jq -Rnc '[inputs]')
          echo "actions=$actions" >> "$GITHUB_OUTPUT"

  test:
    name: Test ${{ matrix.action }}
    needs: discover
    if: needs.discover.outputs.actions != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        action: ${{ fromJson(needs.discover.outputs.actions) }}
    steps:
      - uses: actions/checkout@v7

      - name: Run tests
        env:
          ACTION: ${{ matrix.action }}
        run: bash "$ACTION/test/entrypoint.sh"
