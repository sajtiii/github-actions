name: Dependabot auto-merge
description: Enable auto-merge on Dependabot pull requests with an allowed update type.

inputs:
  update-types:
    description: "List, comma-separated. Update types to auto-merge: version-update:semver-patch, version-update:semver-minor, version-update:semver-major."
    required: false
    default: version-update:semver-patch,version-update:semver-minor
  merge-method:
    description: "Choice: merge, squash, rebase. How the pull request is merged."
    required: false
    default: merge
  github-token:
    description: String. Token that reads the pull request and enables auto-merge.
    required: false
    default: ${{ github.token }}

outputs:
  enabled:
    description: Whether auto-merge was enabled, true or false.
    value: ${{ steps.enable.outputs.enabled }}

runs:
  using: composite
  steps:
    - name: Check inputs
      shell: bash
      env:
        MERGE_METHOD: ${{ inputs.merge-method }}
        UPDATE_TYPES: ${{ inputs.update-types }}
      run: |
        case "$MERGE_METHOD" in
          merge|squash|rebase) ;;
          *) echo "::error::merge-method must be merge, squash or rebase, got '$MERGE_METHOD'"; exit 1 ;;
        esac
        if [ -z "$UPDATE_TYPES" ]; then
          echo "::error::update-types must not be empty"
          exit 1
        fi

    - name: Dependabot metadata
      id: metadata
      if: github.event.pull_request.user.login == 'dependabot[bot]'
      uses: dependabot/fetch-metadata@v2
      with:
        github-token: ${{ inputs.github-token }}

    - name: Enable auto-merge
      id: enable
      shell: bash
      env:
        IS_DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        UPDATE_TYPES: ${{ inputs.update-types }}
        MERGE_METHOD: ${{ inputs.merge-method }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if [ "$IS_DEPENDABOT" != "true" ]; then
          echo "Not a Dependabot pull request, skipping."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if ! printf '%s\n' "${UPDATE_TYPES//,/$'\n'}" | tr -d ' ' | grep -qxF "$UPDATE_TYPE"; then
          echo "Update type '$UPDATE_TYPE' is not in '$UPDATE_TYPES', skipping."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        gh pr merge --auto "--$MERGE_METHOD" "$PR_URL"
        echo "enabled=true" >> "$GITHUB_OUTPUT"
